name: Release
on: workflow_dispatch

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: go install github.com/packwiz/packwiz@latest
      - run: python3 modpack/build.py
      - run: python3 resourcepack/build.py
      - run: python3 .github/release.py
        env:
          GH_TOKEN: ${{ github.token }}