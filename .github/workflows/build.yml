name: Build
on:
  push:
    paths: [modpack/**, drydock.toml, icon.png, .github/workflows/build.yml]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: go install github.com/packwiz/packwiz@latest
      - run: python3 modpack/build.py
      - uses: actions/upload-artifact@v7
        with:
          name: Drydock
          path: build/*.mrpack